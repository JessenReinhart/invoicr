<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoicr</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/logo.png">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class', // or 'media'
      theme: {
        extend: {
          colors: {
            black: '#000000', // True black for Vercel-like dark mode
          },
          fontFamily: {
            sans: ['Quicksand', 'sans-serif'], // Changed to Quicksand
          },
          boxShadow: { // Softer, Vercel-like glows
            'glow-pink-purple': '0 0 12px 0px rgba(236, 72, 153, 0.2), 0 0 6px 0px rgba(168, 85, 247, 0.15)',
            'glow-blue-purple': '0 0 12px 0px rgba(59, 130, 246, 0.2), 0 0 6px 0px rgba(168, 85, 247, 0.15)',
            'dark-glow-pink-purple': '0 0 15px 0px rgba(236, 72, 153, 0.25), 0 0 8px 0px rgba(168, 85, 247, 0.2)',
            'dark-glow-blue-purple': '0 0 15px 0px rgba(59, 130, 246, 0.25), 0 0 8px 0px rgba(168, 85, 247, 0.2)',
          },
          borderRadius: { // Vercel uses slightly sharper rounded corners
            'md': '0.375rem', // Default Tailwind md (6px)
            'lg': '0.5rem',   // Default Tailwind lg (8px)
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Updated Google Fonts link for Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* For Quicksand font */
    body {
      font-family: 'Quicksand', sans-serif;
    }

    .rainbow-border-card {
      padding: 1px;
      /* Thickness of the border */
      background: linear-gradient(to bottom right, #ec4899, #8b5cf6, #3b82f6);
      border-radius: 0.5rem;
      /* Corresponds to Tailwind's rounded-lg (8px) */
    }

    .rainbow-border-card-inner {
      border-radius: calc(0.5rem - 1px);
      /* Slightly less than outer to make border visible (7px) */
    }

    /* Scrollbar styling - Vercel like */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      /* Track is transparent */
    }

    .dark ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      /* gray-600 */
      border-radius: 3px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #6b7280;
      /* gray-500 */
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
      /* gray-700 */
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
      /* gray-400 */
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react-dom": "https://esm.sh/react-dom@^19.1.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-white dark:bg-black text-slate-900 dark:text-slate-50 antialiased transition-colors duration-300">
  <div id="root"></div>
  <div id="toast-container-root" class="fixed top-4 right-4 z-[9999]"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
