<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoicr</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/logo.png">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            black: '#000000',
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          boxShadow: {
            'glow-pink-purple': '0 18px 48px rgba(15, 23, 42, 0.08)',
            'glow-blue-purple': '0 18px 48px rgba(15, 23, 42, 0.08)',
            'dark-glow-pink-purple': '0 18px 48px rgba(0, 0, 0, 0.38)',
            'dark-glow-blue-purple': '0 18px 48px rgba(0, 0, 0, 0.38)',
          },
          borderRadius: {
            'md': '0.75rem',
            'lg': '1rem',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
    }

    .dark {
      color-scheme: dark;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background-image:
        radial-gradient(circle at 20% -10%, rgba(239, 68, 68, 0.07), transparent 30%),
        radial-gradient(circle at 90% 0%, rgba(251, 146, 60, 0.05), transparent 25%);
      background-attachment: fixed;
    }

    .dark body {
      background-image:
        radial-gradient(circle at 20% -10%, rgba(239, 68, 68, 0.10), transparent 26%),
        radial-gradient(circle at 85% 0%, rgba(249, 115, 22, 0.05), transparent 22%);
    }

    .rainbow-border-card {
      padding: 1px;
      background: linear-gradient(145deg, rgba(226, 232, 240, 0.95), rgba(248, 250, 252, 0.35));
      border-radius: 1rem;
    }

    .dark .rainbow-border-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.035));
    }

    .rainbow-border-card-inner {
      border-radius: calc(1rem - 1px);
    }

    .bg-gradient-to-r.from-pink-500.via-purple-600.to-blue-500 {
      background-image: linear-gradient(to right, #ef4444, #f97316, #fb7185) !important;
    }

    ::selection {
      background: rgba(239, 68, 68, 0.18);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #3f3f46;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react-dom": "https://esm.sh/react-dom@^19.1.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-50 antialiased transition-colors duration-300">
  <div id="root"></div>
  <div id="toast-container-root" class="fixed top-4 right-4 z-[9999]"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
